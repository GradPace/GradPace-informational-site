# Template only - never apply it: it uses the real Secret's name, so it
# would overwrite the live secret with this placeholder. Kept in
# k8s/examples/ because `kubectl apply -f k8s/` doesn't descend into
# subfolders. Real secret created out-of-band:
#
#   kubectl create secret generic flask-secret-key --from-literal=secret-key='...' -n gradpace-info
#
# The value is the same one currently in /srv/classproject/.secrets/flask_secret_key.
apiVersion: v1
kind: Secret
metadata:
  name: flask-secret-key
  namespace: gradpace-info
type: Opaque
stringData:
  secret-key: "REPLACE_ME"
